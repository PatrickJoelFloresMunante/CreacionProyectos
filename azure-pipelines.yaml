trigger: none

parameters:
- name: projectName
  type: string
- name: description
  type: string
- name: projectType
  values: [DevSecOps, Tradicional]

pool:
  vmImage: windows-latest

steps:
- checkout: self
  persistCredentials: true

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/validate-naming.ps1" "${{ parameters.projectName }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/create-project.ps1" "${{ parameters.projectName }}" "${{ parameters.description }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/configure-features.ps1" "${{ parameters.projectName }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/create-groups.ps1" "${{ parameters.projectName }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/configure-permissions.ps1" "${{ parameters.projectName }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/import-repos.ps1" "${{ parameters.projectName }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/create-environments.ps1" "${{ parameters.projectName }}" "${{ parameters.projectType }}"

- powershell: |
    & "$(Build.SourcesDirectory)/scripts/configure-approvals.ps1" "${{ parameters.projectName }}"
