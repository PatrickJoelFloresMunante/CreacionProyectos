trigger: none

parameters:
- name: projectName
  type: string
- name: description
  type: string
- name: projectType
  values: [DevSecOps, Tradicional]

pool:
  vmImage: windows-latest

steps:
- checkout: self
  persistCredentials: true

- powershell: ./scripts/validate-naming.ps1 "${{ parameters.projectName }}"

- powershell: ./scripts/create-project.ps1 "${{ parameters.projectName }}" "${{ parameters.description }}"

- powershell: ./scripts/configure-features.ps1 "${{ parameters.projectName }}"

- powershell: ./scripts/create-groups.ps1 "${{ parameters.projectName }}"

- powershell: ./scripts/configure-permissions.ps1 "${{ parameters.projectName }}"

- powershell: ./scripts/import-repos.ps1 "${{ parameters.projectName }}"

- powershell: ./scripts/create-environments.ps1 "${{ parameters.projectName }}" "${{ parameters.projectType }}"

- powershell: ./scripts/configure-approvals.ps1 "${{ parameters.projectName }}"
